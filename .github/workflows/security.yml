name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 04:23, Asia/Shanghai.
    - cron: '23 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep source scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install scanner
        run: python -m pip install semgrep==1.181.0

      - name: Scan application and tools
        run: >-
          semgrep scan --config p/ci --error --strict
          --metrics=off --disable-version-check
          --exclude apps/server/test --exclude apps/web/test --exclude tools/test
          --json-output "$RUNNER_TEMP/semgrep.json"
          --sarif-output "$RUNNER_TEMP/semgrep.sarif" .

      - name: Save scan reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: semgrep-reports
          path: |
            ${{ runner.temp }}/semgrep.json
            ${{ runner.temp }}/semgrep.sarif
          retention-days: 7
          if-no-files-found: warn
